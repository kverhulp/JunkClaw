<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutoScout — Saved criteria</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <h1>Saved criteria</h1>
      <p class="note">
        Drives the Fit score and mutes listings that don't qualify.
      </p>

      <form id="criteria">
        <label>
          Max budget
          <input id="budgetMax" type="number" min="0" step="100" />
        </label>
        <label>
          Max mileage (km)
          <input id="maxMileage" type="number" min="0" step="1000" />
        </label>
        <label>
          Earliest year
          <input id="yearMin" type="number" min="1900" max="2100" />
        </label>
        <label>
          Search radius (km)
          <input id="radiusKm" type="number" min="1" step="5" />
        </label>
        <label>
          From
          <input id="originCity" type="text" />
        </label>
        <label class="check">
          <input id="muteNonQualifying" type="checkbox" />
          Hide listings that don't qualify
        </label>
        <button type="submit">Save</button>
        <span id="saved" class="saved" hidden>Saved</span>
      </form>

      <hr />

      <h2>Connection</h2>
      <label>
        Server
        <input id="apiBaseUrl" type="url" />
      </label>
      <p class="note">
        Paste the token from the web app's “connect extension” page. AutoScout
        never asks for your Facebook password and never signs in as you.
      </p>
      <label>
        Token
        <input id="apiToken" type="password" autocomplete="off" />
      </label>
      <button id="saveConnection" type="button">Save connection</button>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
