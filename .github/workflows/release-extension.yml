name: Release extension

# Tag-driven so a release is always a deliberate act with a reviewable diff
# behind it. `git tag v0.1.0 && git push --tags`.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and zip without creating a GitHub release"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    name: Build · zip · publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # A zip whose manifest version disagrees with its tag is the kind of thing
      # nobody notices until the Web Store rejects the upload.
      - name: Tag matches extension version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./apps/extension/package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag v$tag does not match apps/extension/package.json version $pkg"
            exit 1
          fi
          echo "Tag and manifest agree on $pkg"

      # The full gate runs again here rather than trusting that CI passed on the
      # commit — a tag can point anywhere.
      - name: Guards · lint · typecheck · test
        run: |
          ./scripts/guards.sh
          pnpm lint
          pnpm -r typecheck
          pnpm test

      - name: Zip extension
        run: pnpm --filter @junkclaw/extension zip

      - name: Upload zip as artifact
        uses: actions/upload-artifact@v7
        with:
          name: junkclaw-extension-${{ github.ref_name }}
          path: apps/extension/.output/*.zip
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            apps/extension/.output/*.zip

# Chrome Web Store upload is deliberately NOT automated yet.
#
# The store listing needs a privacy policy and a justification for reading
# facebook.com and transmitting off-device before the first submission — a
# review conversation, not a CI step. Once that listing exists, add
# CHROME_CLIENT_ID / CHROME_CLIENT_SECRET / CHROME_REFRESH_TOKEN as repository
# secrets and a publish step here. See docs/ci-cd.md.
